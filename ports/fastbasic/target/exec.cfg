# FastBasic source target: virtual addresses in one private upper bank.
MEMORY {
    ZP: file="", start=$80, size=$54;
    HEADER: file=%O, start=$2FF0, size=$10;
    MAIN: file=%O, start=$3000, size=$B000;
}
SEGMENTS {
    ZEROPAGE: load=ZP, type=zp, optional=yes;
    PREHEAD: load=HEADER, type=rw, define=yes;
    JUMPTAB: load=MAIN, type=ro, define=yes, align=$100;
    RUNTIME: load=MAIN, type=rw, define=yes, align=$100;
    DATA: load=MAIN, type=rw, define=yes;
    BYTECODE: load=MAIN, type=rw, define=yes;
    CODE: load=MAIN, type=rw, define=yes;
    ALIGNDATA: load=MAIN, type=ro, optional=yes, define=yes, align=$100;
    BSS: load=MAIN, type=bss, optional=yes, define=yes;
    HEAP: load=MAIN, type=bss, optional=yes, define=yes, align=$100;
}
