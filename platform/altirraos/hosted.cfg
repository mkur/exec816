MEMORY { RAM: start = $3000, size = $1000, file = %O, fill = yes; }
SEGMENTS {
    BOOT: load = RAM, type = ro, start = $3000;
    NMI: load = RAM, type = ro, start = $3400;
    IRQ: load = RAM, type = ro, start = $3500;
    GATE: load = RAM, type = ro, start = $3600, optional = yes;
    CONSOLE: load = RAM, type = ro, start = $3800;
    STUBS: load = RAM, type = ro, start = $3a00, optional = yes;
    FAULT: load = RAM, type = ro, start = $3c00;
    EXIT: load = RAM, type = ro, start = $3d00;
    COOP_BOOT: load = RAM, type = ro, start = $3e00, optional = yes;
}
